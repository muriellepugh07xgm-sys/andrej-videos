version: 2.1

jobs:
  postbuild_Run_Pipeline3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: skip
          command: |
            mkdir -p /tmp/workspace
            set +o pipefail 2>/dev/null; seq 1 1322924 | sha256sum > /tmp/workspace/metrics.tsv; true
            size=$(wc -c </tmp/workspace/metrics.tsv); echo "stage ok: Run_Pipeline3 size=${size}"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - metrics.tsv
  Run_Pipeline3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Read handoff file
          command: |
            { head -n 5 /tmp/workspace/metrics.tsv > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Get source tree
          command: git clone --depth 5 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat release.tar.xz | tar xJf -
      - run:
          no_output_timeout: 80m
          command: ./main
  bake_CORE-801:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
